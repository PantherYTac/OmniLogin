  <g filter="url(#panelShadow)">
    <rect x="1008" y="156" width="784" height="768" rx="24" fill="url(#panelFill)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- Window Header -->
  <line x1="1008" y1="220" x2="1792" y2="220" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="1044" cy="188" r="6" fill="#334155"/>
  <circle cx="1066" cy="188" r="6" fill="#334155"/>
  <circle cx="1088" cy="188" r="6" fill="#334155"/>
  <text x="1122" y="194" class="mono" font-size="15.5" font-weight="600" fill="#94A3B8">omnilogin / security-pipeline</text>

  <rect x="1652" y="172" width="112" height="32" rx="16" fill="#052E16" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="1672" cy="188" r="4" fill="#10B981"/>
  <text x="1686" y="193" class="mono" font-size="13.5" font-weight="700" fill="#34D399">ACTIVE</text>

  <!-- Inner Left Card: Virtual PIN-Pad GUI -->
  <rect x="1044" y="252" width="340" height="422" rx="18" fill="#070C17" stroke="#1E293B" stroke-width="1.5"/>
  <text x="1072" y="286" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#64748B">VIRTUAL PIN-PAD GUI</text>

  <!-- Masked PIN input box -->
  <rect x="1072" y="306" width="284" height="52" rx="12" fill="#0E172A" stroke="#25334D" stroke-width="1.5"/>
  <circle cx="1156" cy="332" r="6.5" fill="#38BDF8"/>
  <circle cx="1179" cy="332" r="6.5" fill="#38BDF8"/>
  <circle cx="1202" cy="332" r="6.5" fill="#38BDF8"/>
  <circle cx="1225" cy="332" r="6.5" fill="#38BDF8"/>
  <circle cx="1248" cy="332" r="6.5" fill="#38BDF8"/>
  <circle cx="1271" cy="332" r="6.5" fill="#334155"/>

  <!-- Keypad Grid: 3 cols x 4 rows (84x58 buttons, gap 16) -->
  <!-- Row 1: 1 2 3 -->
  <g class="sans" font-size="22" font-weight="700" text-anchor="middle" fill="#E2E8F0">
    <rect x="1072" y="378" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1114" y="415">1</text>
    <rect x="1172" y="378" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1214" y="415">2</text>
    <rect x="1272" y="378" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1314" y="415">3</text>

    <!-- Row 2: 4 5 6 -->
    <rect x="1072" y="450" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1114" y="487">4</text>
    <rect x="1172" y="450" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1214" y="487">5</text>
    <rect x="1272" y="450" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1314" y="487">6</text>

    <!-- Row 3: 7 8 9 -->
    <rect x="1072" y="522" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1114" y="559">7</text>
    <rect x="1172" y="522" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1214" y="559">8</text>
    <rect x="1272" y="522" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1314" y="559">9</text>

    <!-- Row 4: Clear, 0, Submit -->
    <rect x="1072" y="594" width="84" height="58" rx="12" fill="#1F1219" stroke="#7F1D1D" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="1114" y="630" fill="#FCA5A5" font-size="18">CLR</text>
    <rect x="1172" y="594" width="84" height="58" rx="12" fill="#111B30" stroke="#25334D" stroke-width="1.2"/>
    <text x="1214" y="631">0</text>
    <rect x="1272" y="594" width="84" height="58" rx="12" fill="url(#brandHoriz)"/>
    <path d="M 1302 624 L 1310 632 L 1327 615" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Inner Right Top Card: Handshake Pipeline -->
  <rect x="1408" y="252" width="348" height="200" rx="18" fill="#070C17" stroke="#1E293B" stroke-width="1.5"/>
  <text x="1434" y="286" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#64748B">HYBRID VERIFICATION</text>

  <g class="sans" font-size="16" font-weight="600">
    <circle cx="1444" cy="322" r="9" fill="#052E16" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 1440 322 L 1443 325 L 1449 319" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="1464" y="328" fill="#E2E8F0">Netty Login Start</text>
    <text x="1728" y="328" text-anchor="end" class="mono" font-size="14" fill="#38BDF8">0x00</text>

    <circle cx="1444" cy="368" r="9" fill="#052E16" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 1440 368 L 1443 371 L 1449 365" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="1464" y="374" fill="#E2E8F0">RSA + AES/CFB8</text>
    <text x="1728" y="374" text-anchor="end" class="mono" font-size="14" fill="#34D399">ENCRYPTED</text>

    <circle cx="1444" cy="414" r="9" fill="#052E16" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 1440 414 L 1443 417 L 1449 411" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="1464" y="420" fill="#E2E8F0">Mojang hasJoined</text>
    <text x="1728" y="420" text-anchor="end" class="mono" font-size="14" fill="#34D399">VERIFIED</text>
  </g>

  <!-- Inner Right Bottom Card: Password Security -->
  <rect x="1408" y="474" width="348" height="200" rx="18" fill="#070C17" stroke="#1E293B" stroke-width="1.5"/>
  <text x="1434" y="508" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#64748B">CREDENTIAL GUARD</text>

  <g class="sans" font-size="16" font-weight="600">
    <rect x="1434" y="530" width="8" height="8" rx="2" fill="#38BDF8"/>
    <text x="1454" y="540" fill="#E2E8F0">Length &amp; Complexity Rules</text>
    <rect x="1434" y="576" width="8" height="8" rx="2" fill="#38BDF8"/>
    <text x="1454" y="586" fill="#E2E8F0">Blacklist &amp; Pattern Checks</text>
    <rect x="1434" y="622" width="8" height="8" rx="2" fill="#0072FF"/>
    <text x="1454" y="632" fill="#E2E8F0">Argon2id (No Plaintext Logs)</text>
  </g>

  <!-- Bottom Card: Account Inspection Preview -->
  <rect x="1044" y="698" width="712" height="190" rx="18" fill="#070C17" stroke="#1E293B" stroke-width="1.5"/>
  <text x="1072" y="734" class="mono" font-size="14.5" font-weight="600" fill="#38BDF8">$ /omnicord inspect Notch</text>

  <g class="mono" font-size="15">
    <text x="1072" y="772" fill="#64748B">AUTH STATE:</text>
    <text x="1192" y="772" fill="#34D399">Authenticated (Verified)</text>
    <text x="1508" y="772" fill="#64748B">BACKEND:</text>
    <text x="1600" y="772" fill="#E2E8F0">SQLite WAL</text>

    <text x="1072" y="806" fill="#64748B">HASH ENGINE:</text>
    <text x="1192" y="806" fill="#E2E8F0">Argon2id v19</text>
    <text x="1508" y="806" fill="#64748B">LIMBO:</text>
    <text x="1600" y="806" fill="#FBBF24">30s Timeout</text>
  </g>

  <!-- Subtle progress/security meter bar -->
  <rect x="1072" y="838" width="656" height="12" rx="6" fill="#111B30"/>
  <rect x="1072" y="838" width="520" height="12" rx="6" fill="url(#brandHoriz)"/>
</svg>
