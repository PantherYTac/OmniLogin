<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep obsidian squircle canvas gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="55%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Subtle top-left ambient sheen on badge -->
    <radialGradient id="ambientTop" cx="0.28" cy="0.18" r="0.72">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0072FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand cyan-cobalt gradient -->
    <linearGradient id="brandGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="48%" stop-color="#0095FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Shield inner surface gradient -->
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131D33"/>
      <stop offset="100%" stop-color="#0A101E"/>
    </linearGradient>

    <!-- Crisp subtle border highlight -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Soft drop shadow under shield -->
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Icon Squircle -->
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#ambientTop)"/>

  <!-- Subtle architectural grid lines clipped to squircle -->
  <clipPath id="squircleClip">
    <rect x="24" y="24" width="976" height="976" rx="224"/>
  </clipPath>
  <g clip-path="url(#squircleClip)" opacity="0.05" stroke="#94A3B8" stroke-width="1.5">
    <line x1="256" y1="24" x2="256" y2="1000"/>
    <line x1="512" y1="24" x2="512" y2="1000"/>
    <line x1="768" y1="24" x2="768" y2="1000"/>
    <line x1="24" y1="256" x2="1000" y2="256"/>
    <line x1="24" y1="512" x2="1000" y2="512"/>
    <line x1="24" y1="768" x2="1000" y2="768"/>
  </g>

  <!-- Crisp Squircle Rim -->
  <rect x="25.5" y="25.5" width="973" height="973" rx="222.5" fill="none" stroke="url(#squircleBorder)" stroke-width="3"/>

  <!-- Geometric Shield Mark -->
  <g filter="url(#shieldShadow)">
    <!-- Outer shield body -->
    <path d="M 512 192
             L 776 286
             C 788 290, 796 301, 796 314
             L 796 512
             C 796 668, 672 778, 526 832
             C 517 835, 507 835, 498 832
             C 352 778, 228 668, 228 512
             L 228 314
             C 228 301, 236 290, 248 286
             Z"
          fill="url(#shieldFill)"
          stroke="url(#brandGrad)"
          stroke-width="26"
          stroke-linejoin="round"/>

    <!-- Inner precision chamfer line -->
    <path d="M 512 240
             L 744 322
             L 744 510
             C 744 636, 638 728, 512 778
             C 386 728, 280 636, 280 510
             L 280 322
             Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.08"
          stroke-width="3"
          stroke-linejoin="round"/>
  </g>

  <!-- 'O' Vault Ring -->
  <circle cx="512" cy="500" r="142" fill="none" stroke="#F8FAFC" stroke-width="38"/>

  <!-- Inner subtle contrast ring -->
  <circle cx="512" cy="500" r="102" fill="#070B14" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Precision Keyhole Core -->
  <path d="M 512 430
           C 487.7 430, 468 449.7, 468 474
           C 468 490.5, 477.1 504.9, 490.6 512.4
           L 479 564
           C 477.8 569.3, 481.8 574, 487.2 574
           L 536.8 574
           C 542.2 574, 546.2 569.3, 545 564
           L 533.4 512.4
           C 546.9 504.9, 556 490.5, 556 474
           C 556 449.7, 536.3 430, 512 430 Z"
        fill="url(#brandGrad)"/>
</svg>
