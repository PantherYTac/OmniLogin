# ==============================================================================
# OmniLogin PIN-Pad GUI Configuration
# ==============================================================================

pin-pad:
  # Inventory size (must be a multiple of 9, between 27 and 54).
  size: 45

  # Adventure MiniMessage titles for each PIN-pad mode.
  titles:
    login: "<gradient:#00c6ff:#0072ff><bold>OmniLogin</bold></gradient> <dark_gray>|</dark_gray> <white>Enter PIN</white>"
    register: "<gradient:#00c6ff:#0072ff><bold>OmniLogin</bold></gradient> <dark_gray>|</dark_gray> <white>Create PIN</white>"
    register-confirm: "<gradient:#00c6ff:#0072ff><bold>OmniLogin</bold></gradient> <dark_gray>|</dark_gray> <white>Confirm PIN</white>"

  # Visual rendering mode for digit buttons 0-9:
  # STAINED_GLASS = uses stained glass panes/blocks with clean number labels
  # PLAYER_HEAD   = uses custom textured Mojang skin heads (base64 textures below)
  render-mode: "STAINED_GLASS"

  # Sound effects on button interaction (standard Bukkit Sound enum names).
  sounds:
    digit: "UI_BUTTON_CLICK"
    backspace: "BLOCK_NOTE_BLOCK_BASS"
    clear: "ITEM_SHIELD_BREAK"
    submit: "ENTITY_EXPERIENCE_ORB_PICKUP"
    error: "ENTITY_VILLAGER_NO"

  # Background filler item placed in unused slots.
  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  # Status indicator item showing masked PIN progress.
  display:
    slot: 4
    material: "NETHER_STAR"
    name: "<aqua><bold>Entered PIN</bold></aqua>"
    lore:
      - "<gray>Digits:</gray> <white><masked_pin></white>"
      - "<gray>Length:</gray> <yellow><length>/<max></yellow>"
      - ""
      - "<dark_gray>Click numbers below, then press Submit.</dark_gray>"

  # Keypad button slot mapping (for 45-slot layout).
  slots:
    digit-1: 12
    digit-2: 13
    digit-3: 14
    digit-4: 21
    digit-5: 22
    digit-6: 23
    digit-7: 30
    digit-8: 31
    digit-9: 32
    clear: 38
    backspace: 39
    digit-0: 40
    submit: 42

  # Digit appearance settings.
  digits:
    glass-material: "LIGHT_BLUE_STAINED_GLASS_PANE"
    name-format: "<aqua><bold> [ <digit> ] </bold></aqua>"
    lore:
      - "<gray>Click to append <white><digit></white></gray>"
